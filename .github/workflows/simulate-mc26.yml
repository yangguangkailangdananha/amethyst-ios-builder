name: Simulate MC 26.3 on macOS

on:
  workflow_dispatch:

jobs:
  simulate:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - name: Clone private source
        env:
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git clone --depth 1 --branch feature/mc26-native \
            "https://x-access-token:${SOURCE_TOKEN}@github.com/yangguangkailangdananha/Amethyst-iOS.git" src

      - name: Run Minecraft 26.3 simulation
        run: bash src/tools/sim/run_simulation.sh "$GITHUB_WORKSPACE/src"

      - name: Probe dlsym(RTLD_DEFAULT) from dlopen'ed dylib
        run: bash src/tools/sim/probe_symbols.sh

      - name: Upload simulation logs
        uses: actions/upload-artifact@v4
        with:
          name: mc26-simulation
          path: |
            ${{ runner.temp }}/mc26-sim/sim.log
            ${{ runner.temp }}/mc26-sim/probe.log
          if-no-files-found: warn
